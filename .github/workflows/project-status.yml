# Copies the status label of an issue (backlog / in progress / to test / fixed) into the "Status" field of the
# main GitHub Project and of the game's own project ("<Game> bugs", see game-projects.yml). Setup (once):
#   - secret PROJECT_TOKEN: a classic personal access token with the "project" and "repo" scopes
#     (or a fine-grained token with Projects read and write on your account and Issues read on this repository);
#   - variable PROJECT_NUMBER (optional, default 1): the number of the main Project (in its URL: github.com/users/<you>/projects/<number>).
# A new issue without a game label gets one from the "Game" field of the issue form.
# The label -> Status option mapping is in .github/scripts/game-projects.js (STATUS_MAP); option names are matched without case.
name: Project status from labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const gp = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/game-projects.js`);
            await gp.sync({ github, context, core, mainNumber: parseInt(process.env.PROJECT_NUMBER, 10) });
